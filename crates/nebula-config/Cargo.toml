[package]
name = "nebula-config"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Nebula: per-database config folder (TOML + stopwords file) loading and template generation"

[dependencies]
nebula-core = { path = "../nebula-core" }
nebula-engine = { path = "../nebula-engine" }
nebula-storage = { path = "../nebula-storage" }
nebula-tokenizer = { path = "../nebula-tokenizer" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
