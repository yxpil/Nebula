[package]
name = "nebula-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Nebula: TCP server with challenge-response password auth and encrypted sessions"

[dependencies]
nebula-core = { path = "../nebula-core" }
nebula-crypto = { path = "../nebula-crypto" }
nebula-storage = { path = "../nebula-storage" }
nebula-engine = { path = "../nebula-engine" }
nebula-tokenizer = { path = "../nebula-tokenizer" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
